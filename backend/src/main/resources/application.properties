#####################################
# Server Configuration
#####################################

server.port=${PORT:8080}

#####################################
# Database
#####################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#####################################
# JPA / Hibernate
#####################################

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

#####################################
# Multipart Upload
#####################################

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

#####################################
# Logging
#####################################

logging.level.root=INFO
logging.level.org.travel_stories=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

#####################################
# JWT
#####################################

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.reset-expiration=${PASSWORD_RESET_TOKEN_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

#####################################
# CORS Origin
#####################################

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#####################################
# Password Validation
#####################################

security.password.min-length=8
security.password.max-length=128

###############################################
# Rate Limiting
###############################################

rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-period=1m

rate-limit.signup.capacity=3
rate-limit.signup.refill-tokens=3
rate-limit.signup.refill-period=1m

rate-limit.refresh.capacity=15
rate-limit.refresh.refill-tokens=15
rate-limit.refresh.refill-period=1m

rate-limit.forgot-password.capacity=3
rate-limit.forgot-password.refill-tokens=3
rate-limit.forgot-password.refill-period=15m

rate-limit.verify-reset-otp.capacity=5
rate-limit.verify-reset-otp.refill-tokens=5
rate-limit.verify-reset-otp.refill-period=15m

rate-limit.reset-password.capacity=5
rate-limit.reset-password.refill-tokens=5
rate-limit.reset-password.refill-period=15m

rate-limit.upload.capacity=20
rate-limit.upload.refill-tokens=20
rate-limit.upload.refill-period=60m

#####################################
# File Storage
#####################################

app.storage.provider=${STORAGE_PROVIDER:local}
app.file-storage.path=${FILE_STORAGE_PATH}

#####################################
# Email
#####################################

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

#####################################
# Password Reset / OTP
#####################################

security.password-reset.otp-expiration=${PASSWORD_RESET_OTP_EXPIRATION:300000}
security.password-reset.reset-token-expiration=${PASSWORD_RESET_TOKEN_EXPIRATION:600000}
security.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

#####################################
# Hikari Configuration
#####################################

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#####################################
# Flyway Configuration
#####################################

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
logging.level.org.flywaydb=DEBUG

#####################################
# Application Profile Configuration
#####################################

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

#####################################
# Cloudinary
#####################################

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}