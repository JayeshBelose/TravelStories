#####################################
# Database
#####################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#####################################
# JPA / Hibernate
#####################################

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#####################################
# Multipart Upload
#####################################

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

#####################################
# Logging
#####################################

logging.level.root=INFO
logging.level.org.travel_stories=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

#####################################
# JWT
#####################################

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.reset-expiration=600000
jwt.refresh.expiration=30000

#####################################
# CORS Origin
#####################################

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#####################################
# Password Validation
#####################################

security.password.min-length=12
security.password.max-length=128

###############################################
# Rate Limiting
###############################################

rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-period=1m

rate-limit.signup.capacity=3
rate-limit.signup.refill-tokens=3
rate-limit.signup.refill-period=1m

rate-limit.refresh.capacity=15
rate-limit.refresh.refill-tokens=15
rate-limit.refresh.refill-period=1m

rate-limit.forgot-password.capacity=3
rate-limit.forgot-password.refill-tokens=3
rate-limit.forgot-password.refill-period=15m

rate-limit.reset-password.capacity=5
rate-limit.reset-password.refill-tokens=5
rate-limit.reset-password.refill-period=15m

rate-limit.upload.capacity=20
rate-limit.upload.refill-tokens=20
rate-limit.upload.refill-period=60m

#####################################
# File Storage
#####################################

app.file-storage.base-path=${FILE_STORAGE_PATH:../../travel-stories-storage}